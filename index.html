<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Explore NASA's Astronomy Picture of the Day archive." />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <main class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div>
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <section class="explore-section" aria-labelledby="explore-title">
      <div class="section-heading">
        <p class="eyebrow">The universe, one day at a time</p>
        <h2 id="explore-title">Choose your dates</h2>
      </div>
      <form class="filters" id="dateForm">
        <label>
          <span>From</span>
          <input type="date" id="startDate" required />
        </label>
        <label>
          <span>To</span>
          <input type="date" id="endDate" required />
        </label>
        <button type="submit">Get Space Images</button>
      </form>
    </section>

    <aside class="space-fact" aria-live="polite">
      <span class="fact-mark" aria-hidden="true">★</span>
      <div>
        <p class="eyebrow">Did you know?</p>
        <p id="spaceFact"></p>
      </div>
    </aside>

    <section class="gallery-section" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <div>
          <p class="eyebrow">NASA archive</p>
          <h2 id="gallery-title">Your space gallery</h2>
        </div>
        <p class="gallery-note">Up to 9 days per search</p>
      </div>
      <p class="gallery-status" id="galleryStatus" role="status" aria-live="polite">Choose a date range to explore the archive.</p>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <dialog class="photo-modal" id="photoModal" aria-labelledby="modalTitle">
    <button class="modal-close" id="closeModal" type="button" aria-label="Close image details">&times;</button>
    <img class="modal-image" id="modalImage" alt="" />
    <div class="modal-content">
      <p class="eyebrow" id="modalDate"></p>
      <h2 id="modalTitle"></h2>
      <p id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
